<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>BYENS FRISØR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at top,
          rgba(212, 175, 55, 0.18),
          transparent 35%
        ),
        linear-gradient(160deg, #050505, #171717 55%, #050505);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 20px 24px;
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 26px;
      background: rgba(12, 12, 12, 0.96);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .logo {
      width: 94px;
      height: 94px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 2px solid #d4af37;
      border-radius: 50%;
      color: #f5d778;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.18);
    }

    h1 {
      text-align: center;
      color: #f5d778;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 6px 0 24px;
      text-align: center;
      color: #aaaaaa;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      min-height: 64px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 17px;
      background: linear-gradient(135deg, #242424, #111111);
      transition: transform 0.2s ease;
    }

    .link:active {
      transform: scale(0.98);
    }

    .icon {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 13px;
      color: #f5d778;
      background: #080808;
      font-size: 22px;
      font-weight: bold;
    }

    .text {
      flex: 1;
    }

    .name {
      display: block;
      font-size: 16px;
      font-weight: bold;
    }

    .username {
      display: block;
      margin-top: 3px;
      color: #a8a8a8;
      font-size: 12px;
    }

    .arrow {
      color: #d4af37;
      font-size: 24px;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: #777777;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">BF</div>

    <h1>BYENS FRISØR</h1>
    <p class="subtitle">Barber Shop</p>

    <div class="links">

      <a
        class="link"

        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">♪</span>

        <span class="text">
          <span class="name">TikTok</span>
          <span class="username">@byensfrisr2</span>
        </span>

        <span class="arrow">›</span>
      </a>

      <a
        class="link"

        target="_blank"

      >
        <span class="icon">◎</span>

        <span class="text">
          <span class="name">Instagram</span>
          <span class="username">@byensfrisor1</span>
        </span>

        <span class="arrow">›</span>
      </a>

      <a
        class="link"
        href="https://www.facebook.com/share/1DPv59djf7/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">f</span>

        <span class="text">
          <span class="name">Facebook</span>
          <span class="username">Besøg vores Facebook</span>
        </span>

        <span class="arrow">›</span>
      </a>

      <a
        class="link"

        target="_blank"

      >
        <span class="icon">♙</span>

        <span class="text">
          <span class="name">Snapchat</span>
          <span class="username">Følg BYENS FRISØR</span>
        </span>

        <span class="arrow">›</span>
      </a>

      <a class="link" href="tel:+4525631818">

        <span class="icon">☎</span>

        <span class="text">
          <span class="name">Telefon</span>
          <span class="username">+45 25 63 18 18</span>
        </span>

        <span class="arrow">›</span>
      </a>

    </div>

    <footer>
      © 2026 BYENS FRISØR
    </footer>

  </main>

</body>
</html>
